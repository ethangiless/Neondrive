<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#080814">
<title>NeonDrive</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#080814;--panel:rgba(13,13,32,.93);--purple:#bd39ff;--blue:#27d8ff;--muted:#a6a6c4;--line:rgba(189,57,255,.35)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at top,#21103a 0%,#080814 50%)}header{padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;display:flex;align-items:center;justify-content:space-between;z-index:500;background:linear-gradient(#080814 65%,transparent)}.brand{font-size:20px;font-weight:900;letter-spacing:2px}.brand span{color:var(--blue);text-shadow:0 0 12px var(--blue)}.badge{font-size:10px;letter-spacing:1px;color:#e5caff;border:1px solid var(--line);padding:6px 9px;border-radius:20px}#map{position:absolute;inset:82px 0 178px;background:#0a0a18;z-index:1}.leaflet-container{background:#0a0a18}.leaflet-control-attribution{font-size:9px!important;background:#080814!important;color:#aaa!important}.leaflet-control-attribution a{color:#7edfff!important}.leaflet-control-zoom{display:none}.map-overlay{position:absolute;z-index:400;pointer-events:none;inset:82px 0 178px;background:linear-gradient(180deg,rgba(8,8,20,.2),transparent 25%,transparent 72%,rgba(8,8,20,.35));box-shadow:inset 0 0 40px #09091d}.top-status{position:absolute;top:94px;left:14px;z-index:450;background:var(--panel);border:1px solid var(--line);padding:10px 12px;border-radius:12px;box-shadow:0 0 18px #9b2bff22;font-size:12px}.top-status b{color:var(--blue)}.bottom{position:absolute;z-index:500;bottom:0;left:0;right:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(transparent,#080814 12%);}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 0 24px #a22cff16;backdrop-filter:blur(14px)}.searchrow{display:flex;gap:8px}.searchrow input{min-width:0;flex:1;border:1px solid #393052;background:#101024;color:white;border-radius:12px;padding:13px 12px;font-size:15px;outline:none}.searchrow input:focus{border-color:var(--blue);box-shadow:0 0 12px #27d8ff22}.btn{border:0;border-radius:12px;padding:0 14px;font-weight:800;color:#070713;background:linear-gradient(110deg,var(--purple),var(--blue));white-space:nowrap;font-size:13px}.waze{display:flex;width:100%;justify-content:center;align-items:center;margin-top:10px;min-height:47px;text-decoration:none;border:1px solid #28d9ff8a;border-radius:13px;background:#0b2331;color:#d9faff;font-weight:800;letter-spacing:.4px;box-shadow:0 0 16px #27d8ff16}.waze small{font-weight:500;color:#9bdfee;margin-left:7px}.stats{display:flex;justify-content:space-between;margin-top:12px;color:var(--muted);font-size:10px;letter-spacing:1px}.stat strong{display:block;color:white;font-size:14px;letter-spacing:0;margin-top:4px}.stat:first-child strong{color:var(--purple)}.notice{text-align:center;color:#8888a7;font-size:10px;margin-top:9px}.pin{width:17px;height:17px;border-radius:50%;background:var(--blue);border:3px solid white;box-shadow:0 0 0 6px #27d8ff30,0 0 22px var(--blue)}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#111126;color:#fff;border:1px solid var(--line)}@media(min-width:700px){.app{max-width:480px;margin:auto;border-left:1px solid #24203d;border-right:1px solid #24203d}body{background:#03030a}#map{max-width:480px;left:50%;transform:translateX(-50%);width:100%}.map-overlay{max-width:480px;left:50%;transform:translateX(-50%);width:100%}.bottom{max-width:480px;left:50%;transform:translateX(-50%)}}
</style></head>
<body><div class="app"><header><div class="brand">NEON<span>DRIVE</span></div><div class="badge">NIGHT MODE // ON</div></header><div id="map"></div><div class="map-overlay"></div><div class="top-status">SYSTEM <b>ONLINE</b><br><span style="color:#aaa">NEON MAP PROTOTYPE</span></div><div class="bottom"><div class="panel"><div class="searchrow"><input id="destination" placeholder="Where are we going?" aria-label="Destination"><button class="btn" id="search">FIND</button></div><a class="waze" id="openWaze" href="https://www.waze.com/ul" target="_blank" rel="noopener">↗ OPEN IN WAZE <small>LIVE NAVIGATION</small></a><div class="stats"><div class="stat">MAP STYLE<strong>NEON NIGHT</strong></div><div class="stat">GPS STATUS<strong id="gps">WAITING</strong></div><div class="stat">NAVIGATION<strong>WAZE APP</strong></div></div><div class="notice">Concept interface • Waze opens separately • Not affiliated with Waze</div></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([-26.188,28.320],13);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:20,attribution:'© OpenStreetMap © CARTO'}).addTo(map);
let userMarker=null;let routeLine=null;let current=[-26.188,28.320];
function neonRoute(points){if(routeLine)map.removeLayer(routeLine);L.polyline(points,{color:'#bd39ff',weight:11,opacity:.25,lineCap:'round'}).addTo(map);routeLine=L.polyline(points,{color:'#27d8ff',weight:4,opacity:.95,lineCap:'round'}).addTo(map);}
// Decorative sample route: clearly illustrative, not turn-by-turn directions.
neonRoute([[-26.188,28.320],[-26.182,28.327],[-26.179,28.335],[-26.171,28.341],[-26.166,28.351]]);
L.circleMarker([-26.179,28.335],{radius:7,color:'#bd39ff',weight:3,fillColor:'#080814',fillOpacity:1}).addTo(map).bindPopup('NEON WAYPOINT');
const icon=L.divIcon({className:'',html:'<div class="pin"></div>',iconSize:[20,20],iconAnchor:[10,10]});
function setWaze(){const dest=document.getElementById('destination').value.trim();const a=document.getElementById('openWaze');if(dest){a.href='https://www.waze.com/ul?q='+encodeURIComponent(dest)+'&navigate=yes';}else if(userMarker){a.href='https://www.waze.com/ul?ll='+current[0]+','+current[1]+'&navigate=yes';}else{a.href='https://www.waze.com/ul';}}
document.getElementById('search').addEventListener('click',()=>{const q=document.getElementById('destination').value.trim();if(!q){document.getElementById('destination').focus();return;}setWaze();document.getElementById('openWaze').textContent='↗ OPEN ROUTE IN WAZE';});document.getElementById('destination').addEventListener('input',setWaze);document.getElementById('openWaze').addEventListener('click',setWaze);
if('geolocation' in navigator){navigator.geolocation.getCurrentPosition(pos=>{current=[pos.coords.latitude,pos.coords.longitude];if(userMarker)map.removeLayer(userMarker);userMarker=L.marker(current,{icon}).addTo(map).bindPopup('YOUR LOCATION');map.setView(current,15);document.getElementById('gps').textContent='ACTIVE';setWaze();},()=>{document.getElementById('gps').textContent='UNAVAILABLE';},{enableHighAccuracy:true,timeout:8000,maximumAge:15000});}else document.getElementById('gps').textContent='UNAVAILABLE';
</script></body></html>
